<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WF2 · Taskboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --done: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 3rem 1rem;
      }
      .app { width: 100%; max-width: 480px; }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
      p.sub { margin: 0 0 1.5rem; color: var(--muted); }
      .row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
      input[type="text"] {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #334155;
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
        font-size: 0.95rem;
        background: var(--accent);
        color: #04222e;
        font-weight: 600;
      }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--card);
        padding: 0.65rem 0.8rem;
        border-radius: 8px;
        margin-bottom: 0.5rem;
      }
      li .text { flex: 1; }
      li.done .text { text-decoration: line-through; color: var(--muted); }
      .toggle {
        background: transparent;
        border: 1px solid #334155;
        color: var(--text);
        padding: 0.3rem 0.55rem;
      }
      .toggle.on { border-color: var(--done); color: var(--done); }
      .del {
        background: transparent;
        border: 1px solid #7f1d1d;
        color: #fca5a5;
        padding: 0.3rem 0.55rem;
      }
      footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>📋 Taskboard</h1>
      <p class="sub">A tiny Express app — packaged into a Docker image in Workflow&nbsp;2.</p>

      <div class="row">
        <input id="new-task" type="text" placeholder="Add a task…" />
        <button id="add">Add</button>
      </div>

      <ul id="list"></ul>

      <footer>Served by Node/Express · <span id="health">checking…</span></footer>
    </div>

    <script>
      const list = document.getElementById("list");
      const input = document.getElementById("new-task");

      async function load() {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();
        list.innerHTML = "";
        for (const t of tasks) {
          const li = document.createElement("li");
          if (t.done) li.classList.add("done");
          li.innerHTML = `
            <button class="toggle ${t.done ? "on" : ""}" title="Toggle">${t.done ? "✓" : "○"}</button>
            <span class="text"></span>
            <button class="del" title="Delete">✕</button>`;
          li.querySelector(".text").textContent = t.text;
          li.querySelector(".toggle").onclick = () => toggle(t.id);
          li.querySelector(".del").onclick = () => remove(t.id);
          list.appendChild(li);
        }
      }

      async function add() {
        const text = input.value.trim();
        if (!text) return;
        await fetch("/api/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        input.value = "";
        load();
      }

      async function toggle(id) {
        await fetch(`/api/tasks/${id}`, { method: "PATCH" });
        load();
      }

      async function remove(id) {
        await fetch(`/api/tasks/${id}`, { method: "DELETE" });
        load();
      }

      document.getElementById("add").onclick = add;
      input.addEventListener("keydown", (e) => e.key === "Enter" && add());

      fetch("/api/health")
        .then((r) => r.json())
        .then((h) => (document.getElementById("health").textContent = "health: " + h.status))
        .catch(() => (document.getElementById("health").textContent = "health: down"));

      load();
    </script>
  </body>
</html>
